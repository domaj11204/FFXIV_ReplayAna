name: Deploy Web UI & API to Home Mini-PC via Tailscale Proxy

on:
  workflow_run:
    workflows: ["Publish Docker Image to GHCR"]
    types:
      - completed
  workflow_dispatch: # 允許手動觸發

jobs:
  deploy-to-minipc:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands via GCP ProxyJump
        uses: appleboy/ssh-action@v1.0.3
        with:
          # 目標主機 (您的 mini-pc)
          host: ${{ secrets.MINI_PC_HOST }}
          username: ${{ secrets.MINI_PC_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          
          # 代理跳板 (GCP 主機)
          proxy_host: ${{ secrets.GCP_HOST }}
          proxy_username: ${{ secrets.GCP_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: 22
          
          # 防範首次連線時的 Host Key 驗證詢問導致 Actions 卡死
          disable_verify_host: true
          
          # 部署執行指令
          script: |
            # 建立並進入部署目錄
            mkdir -p ~/mttrn/tool/ffxiv-dc-bot && cd ~/mttrn/tool/ffxiv-dc-bot
            
            # 1. 取得 GitHub 倉庫名稱並轉為小寫 (符合 Docker Image 命名規範)
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            echo "正在拉取最新 Docker 鏡像: ghcr.io/${REPO_LOWER}:latest"
            docker pull ghcr.io/${REPO_LOWER}:latest
            
            # 2. 停止並刪除舊有的服務容器 (如果存在)
            if [ "$(docker ps -aq -f name=ffxiv-analyzer-web)" ]; then
              echo "偵測到舊 Web 容器，正在停止並移除..."
              docker stop ffxiv-analyzer-web
              docker rm ffxiv-analyzer-web
            fi
            
            if [ "$(docker ps -aq -f name=ffxiv-discord-bot)" ]; then
              echo "偵測到舊 Bot 容器，正在停止並移除..."
              docker stop ffxiv-discord-bot
              docker rm ffxiv-discord-bot
            fi
            
            # 3. 偵測本地是否有 cookies.txt，若有則加入掛載參數
            COOKIE_MOUNT=""
            if [ -f cookies.txt ]; then
              echo "偵測到本地 cookies.txt，將掛載至容器內！"
              COOKIE_MOUNT="-v $(pwd)/cookies.txt:/app/cookies.txt"
            fi

            # 4. 啟動 Web UI & API 服務容器
            echo "啟動 Web UI & API 服務容器..."
            docker run -d \
              --name ffxiv-analyzer-web \
              --restart unless-stopped \
              --network host \
              --env-file .env \
              $COOKIE_MOUNT \
              ghcr.io/${REPO_LOWER}:latest
              
            # 4. 啟動 Discord Bot 服務容器 (覆蓋 Entrypoint 執行 discord_bot.py)
            echo "啟動 Discord Bot 服務容器..."
            docker run -d \
              --name ffxiv-discord-bot \
              --restart unless-stopped \
              --network host \
              --env-file .env \
              ghcr.io/${REPO_LOWER}:latest \
              python discord_bot.py
              
            # 5. 清理過期的虛擬映像檔以節省磁碟空間
            docker image prune -f
            
            echo "✅ Mini-PC 地端服務已成功更新並重啟！"
