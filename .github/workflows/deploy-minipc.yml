name: Deploy Web UI & API to Home Mini-PC via Tailscale Proxy

on:
  workflow_run:
    workflows: ["Publish Docker Image to GHCR"]
    types:
      - completed
  workflow_dispatch: # 允許手動觸發

jobs:
  deploy-to-minipc:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands via GCP ProxyJump
        uses: appleboy/ssh-action@v1.0.3
        with:
          # 目標主機 (您的 mini-pc)
          host: ${{ secrets.MINI_PC_HOST }}
          username: ${{ secrets.MINI_PC_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          
          # 代理跳板 (GCP 主機)
          proxy_host: ${{ secrets.GCP_HOST }}
          proxy_username: ${{ secrets.GCP_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: 22
          
          # 防範首次連線時的 Host Key 驗證詢問導致 Actions 卡死
          disable_verify_host: true
          
          # 部署執行指令
          script: |
            # 建立並進入部署目錄
            mkdir -p ~/mttrn/tool/ffxiv-dc-bot && cd ~/mttrn/tool/ffxiv-dc-bot
            
            # 1. 取得 GitHub 倉庫名稱並轉為小寫 (符合 Docker Image 命名規範)
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            echo "正在拉取最新 Docker 鏡像: ghcr.io/${REPO_LOWER}:latest"
            docker pull ghcr.io/${REPO_LOWER}:latest
            
            # 2. 停止並刪除舊有的服務容器 (如果存在)
            if [ "$(docker ps -aq -f name=ffxiv-analyzer-web)" ]; then
              echo "偵測到舊 Web 容器，正在停止並移除..."
              docker stop ffxiv-analyzer-web
              docker rm ffxiv-analyzer-web
            fi
            
            if [ "$(docker ps -aq -f name=ffxiv-discord-bot)" ]; then
              echo "偵測到舊 Bot 容器，正在停止並移除..."
              docker stop ffxiv-discord-bot
              docker rm ffxiv-discord-bot
            fi
            
            # 3. 確保本地 cookie 檔案存在，以利雙向掛載同步
            touch cookies.txt
            touch www.youtube.com_cookies.txt
            COOKIE_MOUNT="-v $(pwd)/cookies.txt:/app/cookies.txt -v $(pwd)/www.youtube.com_cookies.txt:/app/www.youtube.com_cookies.txt"

            # 4. 啟動 Web UI & API 服務容器
            echo "啟動 Web UI & API 服務容器..."
            docker run -d \
              --name ffxiv-analyzer-web \
              --restart unless-stopped \
              --network host \
              --env-file .env \
              $COOKIE_MOUNT \
              ghcr.io/${REPO_LOWER}:latest
              
            # 4. 啟動 Discord Bot 服務容器 (覆蓋 Entrypoint 執行 discord_bot.py)
            echo "啟動 Discord Bot 服務容器..."
            docker run -d \
              --name ffxiv-discord-bot \
              --restart unless-stopped \
              --network host \
              --env-file .env \
              $COOKIE_MOUNT \
              ghcr.io/${REPO_LOWER}:latest \
              python discord_bot.py
              
            # 5. 清理過期的虛擬映像檔以節省磁碟空間
            docker image prune -f
            
            echo "✅ Mini-PC 地端服務已成功更新並重啟！"

      - name: Send Discord Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK }}"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "未設定 DISCORD_WEBHOOK，跳過通知。"
            exit 0
          fi
          
          # 從 main.py 提取版本號
          VERSION_VAL=$(python3 -c 'import re; print(re.search(r"VERSION\s*=\s*\"([^\"]+)\"", open("main.py").read()).group(1))' || echo "未知")
          GIT_BRANCH=$(git branch -r --contains HEAD | grep -v 'HEAD' | head -n 1 | sed 's/.*origin\///' | xargs)
          BRANCH_VAL="${GIT_BRANCH:-${{ github.event.workflow_run.head_branch || github.ref_name }}}"
          
          COLOR=3066993 # 藍色 (預設)
          if [ "$STATUS" = "success" ]; then
            COLOR=5025616 # 綠色 (SUCCESS)
            TEXT="✅ FFXIV Wipe Analyzer 部署成功！"
            DESC="分支: **$BRANCH_VAL**\n版本: **$VERSION_VAL**\n環境: **Mini-PC 地端**\n部署狀態: **成功 (Success)**"
          else
            COLOR=16007990 # 紅色 (FAILURE / CANCELLED)
            TEXT="❌ FFXIV Wipe Analyzer 部署失敗！"
            DESC="分支: **$BRANCH_VAL**\n版本: **$VERSION_VAL**\n環境: **Mini-PC 地端**\n部署狀態: **失敗/取消 (Failure/Cancelled)**\n請前往 GitHub Actions 檢視錯誤日誌。"
          fi
          
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"embeds\": [{\"title\": \"$TEXT\", \"description\": \"$DESC\", \"color\": $COLOR}]}" \
               "$WEBHOOK_URL"
